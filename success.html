<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Message sent · Phionah Najjuma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f0;--card:#fffdf9;--fg:#1e1b18;--muted:#6b645c;--line:#e6ddd0;--accent:#b8431f;--accent-fg:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#16130f;--card:#1e1a15;--fg:#f3ece2;--muted:#a79d90;--line:#322b23;--accent:#ef8a5f;--accent-fg:#16130f;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,600px);padding:clamp(24px,6vw,48px);background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.08)}h1{margin:0 0 14px;font:700 clamp(32px,7vw,48px)/1.15 Fraunces,Georgia,serif}p{color:var(--muted);margin:0 0 26px}.btn{display:inline-block;padding:12px 22px;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none}.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body><main class="card"><h1>Thank you!</h1><p>Your message has been sent. I’ll get back to you as soon as I can.</p><a class="btn" href="/">Return to my portfolio</a></main></body>
</html>
